<marker id="signal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#1c7c89"/></marker>
<marker id="power" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#bd5229"/></marker>
<marker id="control" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#7654a6"/></marker>
<marker id="gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#7b8982"/></marker>
</defs><rect width="1200" height="100%" fill="#ffffff"/>
<text x="36" y="50" font-size="32" fill="#173f35" font-weight="700" text-anchor="start">Three-phase kiln: power and independent safety</text>
<text x="36" y="88" font-size="21" fill="#bd5229" font-weight="700" text-anchor="start">CONCEPT ONLY · a qualified electrician assigns ratings, protection, and terminals.</text>
<rect x="30" y="119" width="1140" height="74" rx="14" fill="#fff7ed" stroke="#eed0a9" stroke-width="2"/>
<text x="51" y="148" font-size="19" fill="#25362f" font-weight="400" text-anchor="start">Do not infer supply voltage, neutral use, current rating, or star/delta connections from this drawing.</text>
<text x="51" y="175" font-size="19" fill="#25362f" font-weight="400" text-anchor="start">Use the kiln nameplate, element data, and the exact power-controller datasheet.</text>
<text x="36" y="233" font-size="22" fill="#173f35" font-weight="700" text-anchor="start">L1 + L2 + L3 follow the designed power path</text>
<rect x="36" y="272" width="149" height="175" rx="14" fill="#fff6f1" stroke="#e6c5b0" stroke-width="2"/>
<text x="110.5" y="351.8" font-size="20" fill="#25362f" font-weight="400" text-anchor="middle">Supply</text>
<text x="110.5" y="380.8" font-size="20" fill="#25362f" font-weight="400" text-anchor="middle">L1 · L2 · L3</text>
<rect x="223" y="272" width="155" height="175" rx="14" fill="#fff6f1" stroke="#e6c5b0" stroke-width="2"/>
<text x="300.5" y="351.8" font-size="20" fill="#25362f" font-weight="400" text-anchor="middle">Lockable</text>
<text x="300.5" y="380.8" font-size="20" fill="#25362f" font-weight="400" text-anchor="middle">isolator</text>
<rect x="416" y="272" width="155" height="175" rx="14" fill="#fff6f1" stroke="#e6c5b0" stroke-width="2"/>
<text x="493.5" y="351.8" font-size="20" fill="#25362f" font-weight="400" text-anchor="middle">Coordinated</text>
<text x="493.5" y="380.8" font-size="20" fill="#25362f" font-weight="400" text-anchor="middle">protection</text>
<rect x="609" y="272" width="160" height="175" rx="14" fill="#fff6f1" stroke="#e6c5b0" stroke-width="2"/>
<text x="689.0" y="337.3" font-size="20" fill="#25362f" font-weight="400" text-anchor="middle">All-phase</text>
<text x="689.0" y="366.3" font-size="20" fill="#25362f" font-weight="400" text-anchor="middle">safety</text>
<text x="689.0" y="395.3" font-size="20" fill="#25362f" font-weight="400" text-anchor="middle">contactor</text>
<rect x="807" y="272" width="175" height="175" rx="14" fill="#fff6f1" stroke="#e6c5b0" stroke-width="2"/>
