<text x="48" y="831" font-size="20" fill="#25362f" font-weight="400" text-anchor="start">Independent sensor + manual-reset temperature limiter + stop chain → safety contactor.</text>
<text x="48" y="862" font-size="20" fill="#25362f" font-weight="400" text-anchor="start">The safety circuit operates without the Orange Pi; SSRs can leak or fail closed.</text>
