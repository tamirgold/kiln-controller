<text x="56" y="929" font-size="21" fill="#173f35" font-weight="700" text-anchor="start">3.3 V logic only</text>
<text x="56" y="960" font-size="18" fill="#25362f" font-weight="400" text-anchor="start">Never apply 5 V to GPIO.</text>
<text x="56" y="991" font-size="18" fill="#25362f" font-weight="400" text-anchor="start">Use the pin 1 marking;</text>
<text x="56" y="1017" font-size="18" fill="#25362f" font-weight="400" text-anchor="start">do not use USB / HDMI</text>
<text x="56" y="1043" font-size="18" fill="#25362f" font-weight="400" text-anchor="start">sockets to orient this view.</text>
