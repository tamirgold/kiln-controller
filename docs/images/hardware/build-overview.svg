<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">The build, at a glance — conceptual system schematic</title>
<desc id="desc">A K-type thermocouple, ceramic-sheathed and ungrounded for the current Raspberry Pi build, feeds a MAX31855 sensor module, which sends temperature to a Raspberry Pi or Orange Pi. The small computer communicates with a phone or laptop over the local network and sends a 3.3 volt heat request to a compatible output interface. The current Raspberry Pi build uses an active-high low-side MOSFET switch powered from the Pi header 5 V, with a 10 kiloohm trigger pull-down; the recorded Orange Pi build uses an active-low mechanical relay. Each interface operates only the SSR control input. In the separate electrician-designed mains circuit, isolation and protection feed a safety contactor, an AC SSR power stage, and the kiln heaters. A separate high-limit controller with its own probe can stop heater power through the contactor independently of the Pi. This is a conceptual schematic; physical wiring and safety shutdown must be verified before heating.</desc>
