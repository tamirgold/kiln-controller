<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1040" viewBox="0 0 1200 1040" role="img" aria-labelledby="title desc">
<title id="title">Temperature sensor: MAX31855 → Orange Pi</title><desc id="desc">MAX31855 sensor wiring using Orange Pi Zero 2W physical header numbers. Pin 1 supplies 3.3 volts, pin 6 is ground, physical pin 23 PH6 drives clock, pin 21 PH8 receives DO, and pin 24 PH5 drives chip select. K thermocouple positive and negative connect to T plus and T minus. MOSI pin 19 PH7 is unused for MAX31855 and needed for MAX31856.</desc>
<defs><style>text{font-family:Arial,Helvetica,sans-serif} .heading{font-weight:700} </style>
<marker id="signal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#1c7c89"/></marker>
<marker id="power" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#bd5229"/></marker>
<marker id="control" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#7654a6"/></marker>
<marker id="gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#7b8982"/></marker>
</defs><rect width="1200" height="100%" fill="#ffffff"/>
<text x="36" y="50" font-size="32" fill="#173f35" font-weight="700" text-anchor="start">Temperature sensor: MAX31855 → Orange Pi</text>
<text x="36" y="87" font-size="21" fill="#52635b" font-weight="400" text-anchor="start">Use physical header pin numbers. Orient the header by the board’s pin 1 mark.</text>
<rect x="36" y="112" width="1128" height="63" rx="14" fill="#fff7ed" stroke="#eed0a9" stroke-width="2"/>
<text x="56" y="151" font-size="20" fill="#25362f" font-weight="400" text-anchor="start">These are Orange Pi pins and GPIO names, not Raspberry Pi BCM numbering.</text>
<rect x="40" y="205" width="445" height="474" rx="14" fill="#f2f8f6" stroke="#c5d9d0" stroke-width="2"/>
<rect x="725" y="205" width="435" height="474" rx="14" fill="#f2f8f6" stroke="#c5d9d0" stroke-width="2"/>
<text x="64" y="247" font-size="25" fill="#173f35" font-weight="700" text-anchor="start">Orange Pi Zero 2W</text>
<text x="748" y="247" font-size="23" fill="#173f35" font-weight="700" text-anchor="start">Compatible MAX31855 module</text>
<text x="64" y="305" font-size="22" fill="#25362f" font-weight="400" text-anchor="start">Pin 1 · 3.3 V</text>
<text x="750" y="305" font-size="22" fill="#25362f" font-weight="400" text-anchor="start">VIN / VCC</text>
<text x="605" y="285" font-size="18" fill="#7654a6" font-weight="400" text-anchor="middle">3.3 V</text>
<path d="M 485 298 L 720 298" fill="none" stroke="#7654a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#control)"/>
<text x="64" y="375" font-size="22" fill="#25362f" font-weight="400" text-anchor="start">Pin 6 · GND</text>
<text x="750" y="375" font-size="22" fill="#25362f" font-weight="400" text-anchor="start">GND</text>
<text x="605" y="355" font-size="18" fill="#7b8982" font-weight="400" text-anchor="middle">ground</text>
<path d="M 485 368 L 720 368" fill="none" stroke="#7b8982" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gray)"/>
<text x="64" y="445" font-size="22" fill="#25362f" font-weight="400" text-anchor="start">Pin 23 · PH6</text>
<text x="750" y="445" font-size="22" fill="#25362f" font-weight="400" text-anchor="start">CLK / SCK</text>
<text x="605" y="425" font-size="18" fill="#1c7c89" font-weight="400" text-anchor="middle">clock</text>
<path d="M 485 438 L 720 438" fill="none" stroke="#1c7c89" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#signal)"/>
<text x="64" y="515" font-size="22" fill="#25362f" font-weight="400" text-anchor="start">Pin 21 · PH8</text>
<text x="750" y="515" font-size="22" fill="#25362f" font-weight="400" text-anchor="start">DO / SO</text>
<text x="605" y="495" font-size="18" fill="#1c7c89" font-weight="400" text-anchor="middle">sensor data</text>
<path d="M 725 508 L 490 508" fill="none" stroke="#1c7c89" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#signal)"/>
<text x="64" y="585" font-size="22" fill="#25362f" font-weight="400" text-anchor="start">Pin 24 · PH5</text>
<text x="750" y="585" font-size="22" fill="#25362f" font-weight="400" text-anchor="start">CS</text>
<text x="605" y="565" font-size="18" fill="#1c7c89" font-weight="400" text-anchor="middle">chip select</text>
<path d="M 485 578 L 720 578" fill="none" stroke="#1c7c89" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#signal)"/>
<text x="835" y="646" font-size="22" fill="#1c7c89" font-weight="700" text-anchor="middle">T+</text>
<text x="1035" y="646" font-size="22" fill="#1c7c89" font-weight="700" text-anchor="middle">T−</text>
<circle cx="835" cy="676" r="5" fill="#1c7c89"/>
<circle cx="1035" cy="676" r="5" fill="#1c7c89"/>
<path d="M 835 779 L 835 681" fill="none" stroke="#1c7c89" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#signal)"/>
<path d="M 1035 779 L 1035 681" fill="none" stroke="#1c7c89" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#signal)"/>
<text x="820" y="735" font-size="23" fill="#1c7c89" font-weight="700" text-anchor="end">+</text>
<text x="1051" y="735" font-size="23" fill="#1c7c89" font-weight="700" text-anchor="start">−</text>
<rect x="725" y="781" width="435" height="123" rx="14" fill="#ffffff" stroke="#c5d9d0" stroke-width="2"/>
<text x="942.5" y="834.8" font-size="20" fill="#25362f" font-weight="400" text-anchor="middle">K-type thermocouple</text>
<text x="942.5" y="863.8" font-size="20" fill="#25362f" font-weight="400" text-anchor="middle">Positive → T+   ·   Negative → T−</text>
<text x="735" y="936" font-size="19" fill="#52635b" font-weight="400" text-anchor="start">Check polarity markings; wire colors vary.</text>
<rect x="40" y="716" width="619" height="220" rx="14" fill="#f7f8f7" stroke="#d4dcd7" stroke-width="2"/>
<text x="63" y="757" font-size="23" fill="#173f35" font-weight="700" text-anchor="start">Pin 19 · PH7 / MOSI</text>
<text x="63" y="797" font-size="21" fill="#25362f" font-weight="400" text-anchor="start">Unused for MAX31855.</text>
<text x="63" y="828" font-size="21" fill="#25362f" font-weight="400" text-anchor="start">MAX31856 needs MOSI and its own</text>
<text x="63" y="859" font-size="21" fill="#25362f" font-weight="400" text-anchor="start">sensor wiring and software configuration.</text>
<rect x="36" y="968" width="1128" height="51" rx="14" fill="#fff7ed" stroke="#eed0a9" stroke-width="2"/>
<text x="58" y="1002" font-size="22" fill="#25362f" font-weight="700" text-anchor="start">3.3 V logic only. Never put 5 V on an Orange Pi GPIO.</text>
</svg>