<text x="135.5" y="237.14" font-size="21" fill="#25362f" font-weight="400" text-anchor="middle">K-type</text>
<text x="135.5" y="267.14" font-size="21" fill="#25362f" font-weight="400" text-anchor="middle">thermocouple</text>
<rect x="266" y="188" width="175" height="114" rx="14" fill="#ffffff" stroke="#c9d6d0" stroke-width="2"/>
