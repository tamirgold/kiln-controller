<rect x="30" y="479" width="1140" height="98" rx="14" fill="#f7f8f7" stroke="#d4dcd7" stroke-width="2"/>
<text x="51" y="511" font-size="20" fill="#25362f" font-weight="400" text-anchor="start">Power stage: a suitable three-phase unit OR compatible single-phase SSRs, as designed.</text>
<text x="51" y="543" font-size="20" fill="#25362f" font-weight="400" text-anchor="start">Use an approved on/off control interface. Retain the kiln’s factory star/delta connections.</text>
<text x="36" y="621" font-size="22" fill="#568522" font-weight="700" text-anchor="start">PE · uninterrupted protective earth</text>
<path d="M 41 651 L 1033 651" fill="none" stroke="#568522" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="1035" y="602" width="129" height="83" rx="14" fill="#f3f8ec" stroke="#bdd09f" stroke-width="2"/>
<text x="1099" y="636" font-size="20" fill="#568522" font-weight="700" text-anchor="middle">Kiln</text>
<text x="1099" y="664" font-size="20" fill="#568522" font-weight="700" text-anchor="middle">chassis</text>
<text x="36" y="685" font-size="19" fill="#568522" font-weight="400" text-anchor="start">Never switch PE through a relay, SSR, or contactor.</text>
<rect x="30" y="719" width="1140" height="73" rx="14" fill="#f7f8f7" stroke="#d4dcd7" stroke-width="2"/>
<text x="51" y="749" font-size="20" fill="#25362f" font-weight="400" text-anchor="start">N · only if required by the nameplate and electrical design.</text>
<text x="51" y="777" font-size="20" fill="#25362f" font-weight="400" text-anchor="start">Do not assume a neutral is present, and never bridge neutral to protective earth.</text>
<rect x="30" y="829" width="1140" height="266" rx="14" fill="#f7f6fa" stroke="#d4cbe2" stroke-width="2"/>
<text x="51" y="868" font-size="22" fill="#173f35" font-weight="700" text-anchor="start">Independent safety circuit · hardwired, with its own temperature sensor</text>
<rect x="51" y="904" width="238" height="118" rx="14" fill="#ffffff" stroke="#d4cbe2" stroke-width="2"/>
<text x="170.0" y="955.3" font-size="20" fill="#25362f" font-weight="400" text-anchor="middle">Independent</text>
<text x="170.0" y="984.3" font-size="20" fill="#25362f" font-weight="400" text-anchor="middle">temperature sensor</text>
<rect x="334" y="904" width="263" height="118" rx="14" fill="#ffffff" stroke="#d4cbe2" stroke-width="2"/>
<text x="465.5" y="955.3" font-size="20" fill="#25362f" font-weight="400" text-anchor="middle">Manual-reset</text>
<text x="465.5" y="984.3" font-size="20" fill="#25362f" font-weight="400" text-anchor="middle">temperature limiter</text>
<rect x="642" y="904" width="208" height="118" rx="14" fill="#ffffff" stroke="#d4cbe2" stroke-width="2"/>
<text x="746.0" y="955.3" font-size="20" fill="#25362f" font-weight="400" text-anchor="middle">Stop / safety</text>
<text x="746.0" y="984.3" font-size="20" fill="#25362f" font-weight="400" text-anchor="middle">chain</text>
<rect x="895" y="904" width="251" height="118" rx="14" fill="#ffffff" stroke="#d4cbe2" stroke-width="2"/>
<text x="1020.5" y="955.3" font-size="20" fill="#25362f" font-weight="400" text-anchor="middle">Safety contactor</text>
<text x="1020.5" y="984.3" font-size="20" fill="#25362f" font-weight="400" text-anchor="middle">coil</text>
<path d="M 289 962 L 329 962" fill="none" stroke="#7654a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#control)"/>
<path d="M 597 962 L 637 962" fill="none" stroke="#7654a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#control)"/>
<path d="M 850 962 L 890 962" fill="none" stroke="#7654a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#control)"/>
<text x="51" y="1067" font-size="19" fill="#52635b" font-weight="400" text-anchor="start">Coil/control voltage and safety circuitry must be designed. No Pi GPIO safety actuation is shown.</text>
<text x="36" y="1141" font-size="20" fill="#25362f" font-weight="400" text-anchor="start">SSRs can leak or fail closed. A contactor does not replace a lockable isolator.</text>
<text x="36" y="1175" font-size="20" fill="#25362f" font-weight="400" text-anchor="start">One software heat request controls all phases together; this is not independent three-zone control.</text>
</svg>