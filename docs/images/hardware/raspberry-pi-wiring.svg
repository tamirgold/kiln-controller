<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1154" viewBox="0 0 1200 1154" role="img" aria-labelledby="title desc">
<title id="title">Raspberry Pi 3 / 4 — low-voltage connection schematic; physical verification required</title>
<desc id="desc">Raspberry Pi 3 or 4 with a 40-pin header. Find physical pin 1 using the board marking or manual, not USB socket orientation. For a compatible MAX31855 breakout: physical pin 1 supplies 3.3 volts to its supply input; pin 6 connects ground; pin 23, BCM11 connects CLK or SCK; pin 21, BCM9 receives DO, SO or MISO; pin 24, BCM8 connects CS. Pin 19, BCM10 MOSI is used only for MAX31856 SDI and remains disconnected for MAX31855. K-type thermocouple polarity connects to T plus and T minus. Physical pin 37, BCM26 supplies the heat request to a 3.3 volt-compatible driver input, never directly to the SSR. Pin 39 is driver logic ground where the driver datasheet requires a shared reference. This is a connection schematic, not a physical sensor-module layout. Verify every physical connection with kiln mains isolated before enabling heat.</desc>
<defs><style>text{font-family:Arial,Helvetica,sans-serif}</style>
<marker id="signal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#1c7c89"/></marker>
<marker id="heat" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#bd5229"/></marker>
<marker id="power" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#7654a6"/></marker>
<marker id="ground" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#7b8982"/></marker>
</defs>
