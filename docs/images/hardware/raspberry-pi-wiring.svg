<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1710" viewBox="0 0 1200 1710" role="img" aria-labelledby="title desc">
<title id="title">Raspberry Pi 3 / 4 — low-voltage connection schematic; physical verification required</title>
<desc id="desc">Raspberry Pi 3 or 4 with a 40-pin header. Find physical pin 1 using the board marking or manual, not USB socket orientation. For a compatible MAX31855 breakout: pin 1 supplies 3.3 volts; pin 6 connects ground; pin 23, BCM11 connects CLK; pin 21, BCM9 receives DO; pin 24, BCM8 connects CS. Pin 19, BCM10 MOSI is used only for MAX31856 and remains disconnected for MAX31855. For a verified active-high low-side MOSFET module accepting nominal 5 volt power and a Pi-safe 3.3 volt trigger: physical pin 2 supplies DC plus, pin 14 connects DC minus, pin 37 BCM26 supplies TRIG or PWM, and pin 39 connects logic GND if separate. Power and logic grounds are common. OUT plus connects internally to DC plus and connects to SSR DC input plus. Switched OUT minus connects to SSR DC input minus; do not connect SSR minus directly to ground. A suitable 10 kiloohm pull-down connects TRIG to logic GND. Leave output inversion off; LOW means no heat. The Pi USB supply is the only control supply. Header 5 volts may remain live after OS shutdown; verify OFF behavior. This is a connection schematic, not a physical module layout. Verify the exact module and every connection with kiln mains isolated before enabling heat.</desc>
<defs><style>text{font-family:Arial,Helvetica,sans-serif}</style>
<marker id="signal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#1c7c89"/></marker>
<marker id="heat" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#bd5229"/></marker>
<marker id="power" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#7654a6"/></marker>
<marker id="ground" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#7b8982"/></marker>
</defs>
