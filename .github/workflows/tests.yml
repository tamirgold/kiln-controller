name: Software checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  simulation:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11']
        board: [orange-pi-zero-2w, raspberry-pi]
    env:
      KILN_SIMULATE: '1'
      KILN_BOARD: ${{ matrix.board }}
      KILN_SETTINGS_FILE: /tmp/kiln-ci-settings.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install software-only dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check dependencies and shell syntax
        run: |
          python -m pip check
          bash -n setup.sh scripts/run-simulation.sh
      - name: Test simulation, profiles, settings and installation
        run: python -m pytest -q Test
