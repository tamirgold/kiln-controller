<text x="797.0" y="237.14" font-size="21" fill="#25362f" font-weight="400" text-anchor="middle">Relay /</text>
<text x="797.0" y="267.14" font-size="21" fill="#25362f" font-weight="400" text-anchor="middle">interface</text>
