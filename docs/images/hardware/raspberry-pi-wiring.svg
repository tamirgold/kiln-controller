<text x="221" y="792" font-size="18" fill="#52635b" font-weight="400" text-anchor="start">40</text>
<text x="168" y="839" font-size="18" fill="#173f35" font-weight="700" text-anchor="middle">Physical pin numbers</text>
<text x="168" y="862" font-size="16" fill="#52635b" font-weight="400" text-anchor="middle">Highlighted = used below</text>
<rect x="36" y="896" width="264" height="168" rx="14" fill="white" stroke="#c5d9d0" stroke-width="2"/>
<text x="56" y="929" font-size="21" fill="#173f35" font-weight="700" text-anchor="start">3.3 V logic only</text>
<text x="56" y="960" font-size="18" fill="#25362f" font-weight="400" text-anchor="start">Never apply 5 V to GPIO.</text>
<text x="56" y="991" font-size="18" fill="#25362f" font-weight="400" text-anchor="start">Use the pin 1 marking;</text>
<text x="56" y="1017" font-size="18" fill="#25362f" font-weight="400" text-anchor="start">do not use USB / HDMI</text>
<text x="56" y="1043" font-size="18" fill="#25362f" font-weight="400" text-anchor="start">sockets to orient this view.</text>
<rect x="327" y="204" width="837" height="575" rx="14" fill="#f2f8f6" stroke="#c5d9d0" stroke-width="2"/>
<text x="350" y="243" font-size="25" fill="#173f35" font-weight="700" text-anchor="start">1. Connect the temperature sensor</text>
<text x="350" y="276" font-size="19" fill="#52635b" font-weight="400" text-anchor="start">The two columns describe labels, not physical connector positions.</text>
<text x="350" y="324" font-size="19" fill="#173f35" font-weight="700" text-anchor="start">Pi physical pin · signal</text>
<text x="770" y="324" font-size="19" fill="#173f35" font-weight="700" text-anchor="start">MAX31855 module label</text>
<text x="350" y="373" font-size="22" fill="#25362f" font-weight="400" text-anchor="start">1 · 3.3 V</text>
<text x="770" y="373" font-size="22" fill="#25362f" font-weight="400" text-anchor="start">VIN / VCC*</text>
<path d="M 624 366 L 737 366" fill="none" stroke="#7654a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#power)"/>
<text x="350" y="423" font-size="22" fill="#25362f" font-weight="400" text-anchor="start">6 · GND</text>
<text x="770" y="423" font-size="22" fill="#25362f" font-weight="400" text-anchor="start">GND</text>
<path d="M 624 416 L 737 416" fill="none" stroke="#7b8982" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ground)"/>
<text x="350" y="473" font-size="22" fill="#25362f" font-weight="400" text-anchor="start">23 · BCM11</text>
<text x="770" y="473" font-size="22" fill="#25362f" font-weight="400" text-anchor="start">CLK / SCK</text>
<path d="M 624 466 L 737 466" fill="none" stroke="#1c7c89" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#signal)"/>
<text x="350" y="523" font-size="22" fill="#25362f" font-weight="400" text-anchor="start">21 · BCM9</text>
<text x="770" y="523" font-size="22" fill="#25362f" font-weight="400" text-anchor="start">DO / SO / MISO</text>
<path d="M 737 516 L 624 516" fill="none" stroke="#1c7c89" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#signal)"/>
<text x="350" y="573" font-size="22" fill="#25362f" font-weight="400" text-anchor="start">24 · BCM8</text>
<text x="770" y="573" font-size="22" fill="#25362f" font-weight="400" text-anchor="start">CS</text>
<path d="M 624 566 L 737 566" fill="none" stroke="#1c7c89" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#signal)"/>
<rect x="346" y="597" width="800" height="79" rx="14" fill="white" stroke="#c5d9d0" stroke-width="2"/>
<text x="361" y="622" font-size="17" fill="#52635b" font-weight="700" text-anchor="start">MAX31856 ONLY · leave pin 19 disconnected for MAX31855</text>
<text x="361" y="654" font-size="21" fill="#25362f" font-weight="400" text-anchor="start">19 · BCM10 / MOSI</text>
<path d="M 624 647 L 737 647" fill="none" stroke="#1c7c89" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#signal)" stroke-dasharray="7 6"/>
<text x="770" y="654" font-size="21" fill="#25362f" font-weight="400" text-anchor="start">SDI / MOSI</text>
<text x="350" y="711" font-size="18" fill="#25362f" font-weight="400" text-anchor="start">* Use a 3.3 V-compatible supply input. 3Vo is an output, not VIN.</text>
<text x="350" y="741" font-size="18" fill="#25362f" font-weight="400" text-anchor="start">K-type probe: positive → T+, negative → T−. Check polarity markings.</text>
<text x="350" y="765" font-size="18" fill="#52635b" font-weight="400" text-anchor="start">Use an ungrounded probe with MAX31855; keep the module cool.</text>
<rect x="327" y="802" width="837" height="322" rx="14" fill="#f2f8f6" stroke="#c5d9d0" stroke-width="2"/>
<text x="350" y="840" font-size="25" fill="#173f35" font-weight="700" text-anchor="start">2. Connect the MOSFET switch module</text>
<text x="350" y="873" font-size="19" fill="#52635b" font-weight="400" text-anchor="start">Required: active-high, low-side type; verify the exact module.</text>
<text x="350" y="919" font-size="21" fill="#25362f" font-weight="400" text-anchor="start">2 · +5 V power</text>
<path d="M 624 912 L 737 912" fill="none" stroke="#7654a6" stroke-width="3" stroke-linecap="round" marker-end="url(#power)"/>
<text x="770" y="919" font-size="21" fill="#25362f" font-weight="400" text-anchor="start">DC+ (nominal 5 V)</text>
<text x="350" y="969" font-size="21" fill="#25362f" font-weight="400" text-anchor="start">37 · BCM26 / D26</text>
<path d="M 624 962 L 737 962" fill="none" stroke="#bd5229" stroke-width="3" stroke-linecap="round" marker-end="url(#heat)"/>
<text x="770" y="969" font-size="21" fill="#25362f" font-weight="400" text-anchor="start">TRIG / PWM · 3.3 V logic</text>
<text x="350" y="1019" font-size="21" fill="#25362f" font-weight="400" text-anchor="start">14 · GND</text>
<path d="M 624 1012 L 737 1012" fill="none" stroke="#7b8982" stroke-width="3" stroke-linecap="round" marker-end="url(#ground)"/>
<text x="770" y="1019" font-size="21" fill="#25362f" font-weight="400" text-anchor="start">DC− (power return)</text>
<text x="350" y="1069" font-size="21" fill="#25362f" font-weight="400" text-anchor="start">39 · GND</text>
<path d="M 624 1062 L 737 1062" fill="none" stroke="#7b8982" stroke-width="3" stroke-linecap="round" marker-end="url(#ground)"/>
<text x="770" y="1069" font-size="21" fill="#25362f" font-weight="400" text-anchor="start">Logic GND, if separate</text>
<text x="350" y="1101" font-size="18" fill="#52635b" font-weight="400" text-anchor="start">Power and logic grounds are common in this module arrangement.</text>
<rect x="36" y="1086" width="264" height="255" rx="14" fill="white" stroke="#c5d9d0" stroke-width="2"/>
<text x="56" y="1121" font-size="21" fill="#173f35" font-weight="700" text-anchor="start">One control supply</text>
<text x="56" y="1154" font-size="18" fill="#25362f" font-weight="400" text-anchor="start">Use the Pi USB supply.</text>
<text x="56" y="1181" font-size="18" fill="#25362f" font-weight="400" text-anchor="start">No extra 5 V supply.</text>
<text x="56" y="1220" font-size="18" fill="#25362f" font-weight="400" text-anchor="start">Budget for Pi/accessories,</text>
<text x="56" y="1247" font-size="18" fill="#25362f" font-weight="400" text-anchor="start">module consumption and</text>
<text x="56" y="1274" font-size="18" fill="#25362f" font-weight="400" text-anchor="start">SSR input: up to 40 mA</text>
<text x="56" y="1311" font-size="16" fill="#52635b" font-weight="400" text-anchor="start">Per supplied SSR reference.</text>
<rect x="327" y="1146" width="837" height="195" rx="14" fill="#f2f8f6" stroke="#c5d9d0" stroke-width="2"/>
<text x="350" y="1184" font-size="25" fill="#173f35" font-weight="700" text-anchor="start">3. Connect only the SSR's DC input</text>
<text x="350" y="1230" font-size="21" fill="#25362f" font-weight="400" text-anchor="start">OUT+ (= DC+)</text>
<path d="M 624 1223 L 737 1223" fill="none" stroke="#7654a6" stroke-width="3" stroke-linecap="round" marker-end="url(#power)"/>
<text x="770" y="1230" font-size="21" fill="#25362f" font-weight="400" text-anchor="start">SSR DC input +</text>
<text x="350" y="1280" font-size="21" fill="#25362f" font-weight="400" text-anchor="start">OUT− (switched return)</text>
<path d="M 737 1273 L 624 1273" fill="none" stroke="#7b8982" stroke-width="3" stroke-linecap="round" marker-end="url(#ground)"/>
<text x="770" y="1280" font-size="21" fill="#25362f" font-weight="400" text-anchor="start">SSR DC input −</text>
<text x="350" y="1315" font-size="18" fill="#bd5229" font-weight="700" text-anchor="start">Never connect SSR input − directly to Pi GND: it bypasses the switch.</text>
<rect x="36" y="1363" width="1128" height="248" rx="14" fill="white" stroke="#c5d9d0" stroke-width="2"/>
<text x="56" y="1398" font-size="21" fill="#173f35" font-weight="700" text-anchor="start">Trigger bias and OFF checks</text>
<text x="56" y="1431" font-size="19" fill="#25362f" font-weight="400" text-anchor="start">Add a suitable 10 kΩ pull-down from TRIG / PWM to module logic GND. Check the module input circuit.</text>
<text x="56" y="1462" font-size="19" fill="#25362f" font-weight="400" text-anchor="start">LOW = no heat; HIGH = heat request. Leave “Invert SSR control signal” OFF (gpio_heat_invert = False).</text>
<text x="56" y="1493" font-size="19" fill="#25362f" font-weight="400" text-anchor="start">A pull-down biases a floating input; it cannot override a GPIO driven HIGH. Verify boot and shutdown states.</text>
<text x="56" y="1524" font-size="19" fill="#25362f" font-weight="400" text-anchor="start">Header 5 V can stay live after OS shutdown. Check OFF while 5 V remains present and when power is removed.</text>
<text x="56" y="1555" font-size="19" fill="#25362f" font-weight="400" text-anchor="start">Use timed ON/OFF heat requests for the AC SSR. The module's “PWM” name does not require fast PWM.</text>
<text x="56" y="1586" font-size="19" fill="#bd5229" font-weight="700" text-anchor="start">GPIO must not drive the SSR input directly. Keep all SSR AC load terminals unwired during these checks.</text>
<rect x="36" y="1633" width="1128" height="55" rx="12" fill="#fff7ed" stroke="#eed0a9" stroke-width="2"/>
<text x="56" y="1668" font-size="20" fill="#25362f" font-weight="700" text-anchor="start">Physical validation required: with kiln mains isolated, verify each connection before enabling heat.</text>
</svg>
