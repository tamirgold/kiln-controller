<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1240" viewBox="0 0 1200 1240" role="img" aria-labelledby="title desc">
<title id="title">Three-phase kiln: power and independent safety</title><desc id="desc">Conceptual electrical architecture only, not terminal wiring. Three-phase supply goes through a lockable isolator, coordinated protection, an all-phase safety contactor, a suitably selected SSR or power controller, and the kiln’s existing factory-connected elements. Protective earth is uninterrupted to the chassis. Neutral is included only where required. An independent temperature sensor, manual-reset limiter, and stop chain are hardwired to the contactor coil, independent of the Orange Pi. Ratings, terminals and coil voltage must be designed by a qualified electrician.</desc>
